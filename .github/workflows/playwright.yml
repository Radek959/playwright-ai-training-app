# Nazwa workflow - będzie widoczna w zakładce Actions w GitHub
name: Playwright Tests

# Definiuje kiedy workflow ma się uruchomić
on:
  # Uruchamia workflow przy każdym push do gałęzi main
  push:
    branches: [ main ]
  # Uruchamia workflow przy każdym pull request do gałęzi main
  pull_request:
    branches: [ main ]

# Definiuje zadania do wykonania
jobs:
  # Nazwa job'a - może być dowolna
  test:
    # Limit czasu wykonania job'a (domyślnie 360 minut)
    timeout-minutes: 60
    # Określa system operacyjny, na którym job będzie wykonywany
    runs-on: ubuntu-latest
    
    steps:
    # Krok 1: Pobiera kod źródłowy z repozytorium
    - name: Checkout repository
      uses: actions/checkout@v4

    # Krok 2: Instaluje Node.js w wersji 20 (LTS)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Opcjonalnie: cache zależności npm dla szybszych buildów
        cache: 'npm'

    # Krok 3: Instaluje zależności w folderze głównym
    - name: Install root dependencies
      run: npm ci

    # Krok 4: Instaluje zależności w folderze client (frontend Vite)
    - name: Install client dependencies
      working-directory: ./client
      run: npm ci

    # Krok 5: Instaluje zależności w folderze server (backend Express)
    - name: Install server dependencies
      working-directory: ./server
      run: npm ci

    # Krok 6: Instaluje przeglądarki Playwright wraz z zależnościami systemowymi
    # Flaga --with-deps instaluje wszystkie wymagane biblioteki systemowe (np. libgbm, libgtk, etc.)
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # Krok 7: Uruchamia backend (Express) w tle
    # Symbol & na końcu uruchamia proces w tle
    - name: Start backend server
      working-directory: ./server
      run: npm run dev &
      env:
        # Opcjonalnie: ustaw zmienne środowiskowe dla backendu
        NODE_ENV: test

    # Krok 8: Uruchamia frontend (Vite) w tle
    - name: Start frontend server
      working-directory: ./client
      run: npm run dev &
      env:
        # Opcjonalnie: ustaw zmienne środowiskowe dla frontendu
        NODE_ENV: test

    # Krok 9: Czeka aż frontend będzie gotowy do przyjmowania requestów
    # wait-on sprawdza dostępność URL przed przejściem dalej
    # Timeout: 60 sekund, sprawdza co 1 sekundę
    - name: Wait for frontend to be ready
      run: npx wait-on http://localhost:5173 --timeout 60000

    # Opcjonalnie: Czeka aż backend będzie gotowy (jeśli ma swój port)
    # Odkomentuj jeśli backend działa na osobnym porcie (np. 3000)
    # - name: Wait for backend to be ready
    #   run: npx wait-on http://localhost:3000 --timeout 60000

    # Krok 10: Uruchamia testy Playwright
    # Wszystkie testy z folderu tests/ zostaną uruchomione
    - name: Run Playwright tests
      run: npx playwright test

    # Krok 11: Zapisuje artefakty (raport Playwright)
    # uses: always() zapewnia, że raport zostanie zapisany nawet jeśli testy failed
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        # Nazwa artefaktu widoczna w GitHub Actions
        name: playwright-report
        # Ścieżka do folderu z raportem
        path: playwright-report/
        # Czas przechowywania artefaktu (30 dni)
        retention-days: 30

    # Opcjonalnie: Zapisuje test-results jako osobny artefakt
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
