name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    name: Quality gates and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies (root, client, server)
        run: |
          npm ci --ignore-scripts
          npm ci --prefix server
          npm ci --prefix client

      - name: Verify lockfiles were not modified by install
        run: git diff --exit-code -- package-lock.json client/package-lock.json server/package-lock.json

      - name: Security audit
        run: npm run audit:all

      - name: Lint, typecheck, test and build
        run: npm run check

      - name: Start application (frontend + backend)
        run: |
          npm run dev > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for backend health check
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3001/api/health; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend did not become healthy in time"
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:5173 > /dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          echo "Frontend did not become available in time"
          exit 1

      - name: Show application logs
        if: always()
        run: cat app.log || true

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
          pkill -f "vite" 2>/dev/null || true
          pkill -f "tsx watch" 2>/dev/null || true
